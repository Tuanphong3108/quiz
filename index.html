<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thách Đấu: Bạn Hiểu Tôi Đến Đâu? 🎮🔥</title>
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { fontFamily: { sans: ['Google Sans Flex', 'sans-serif'] } }
            }
        }
    </script>
    <style>
        body { font-family: 'Google Sans Flex', sans-serif; background-color: #f3edf7; color: #1d1b20; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; transition: font-variation-settings 0.2s; }
        .material-symbols-outlined:hover { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="w-full min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <main class="w-full max-w-3xl bg-[#fffbfe] rounded-3xl shadow-xl p-6 md:p-10 border border-[#e7e0ec]">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <span class="material-symbols-outlined text-6xl text-[#6750a4] mb-2">psychology</span>
            <h1 class="text-3xl md:text-4xl font-bold text-[#1d1b20]">Hiểu Tôi Hơi Khó - Chê Tôi Hơi Phí 😎</h1>
        </div>

        <!-- Màn 1: Nhập Tên -->
        <div id="screen-name" class="space-y-6">
            <div class="bg-[#f7f2fa] p-6 rounded-2xl border border-[#e6e1e5]">
                <label class="block text-sm font-medium text-[#49454f] mb-2">Nhập danh tính đại hiệp trước khi nộp mạng:</label>
                <input type="text" id="player-name-input" placeholder="Tên hoặc biệt danh..." 
                    class="w-full px-4 py-3 rounded-xl border border-[#79747e] bg-white text-[#1d1b20] focus:outline-none focus:border-[#6750a4] focus:ring-2 focus:ring-[#6750a4]/20">
                <p id="name-error" class="text-sm text-[#b3261e] mt-2 hidden font-semibold"></p>
            </div>
            <button id="btn-start" class="w-full py-4 bg-[#6750a4] text-white font-semibold rounded-2xl shadow-md hover:bg-[#523d8b] transition-all flex items-center justify-center gap-2 cursor-pointer">
                <span class="material-symbols-outlined">play_arrow</span> Bắt đầu chiến đấu
            </button>
        </div>

        <!-- Màn 2: Nhập Mật Khẩu Admin (Nếu gõ PhongVN) -->
        <div id="screen-admin-auth" class="hidden space-y-6">
            <div class="bg-[#f7f2fa] p-6 rounded-2xl border border-[#e6e1e5]">
                <div class="flex items-center gap-2 mb-4 text-[#6750a4]">
                    <span class="material-symbols-outlined text-3xl">admin_panel_settings</span>
                    <h2 class="text-xl font-bold">Xác minh Chủ Nhân (Phong VN)</h2>
                </div>
                <input type="password" id="admin-pass-input" placeholder="Nhập Master Key..." 
                    class="w-full px-4 py-3 rounded-xl border border-[#79747e] bg-white text-[#1d1b20] focus:outline-none focus:border-[#6750a4]">
                <p id="admin-pass-error" class="text-sm text-[#b3261e] mt-2 hidden">Mật khẩu sai rồi bro ơi! 💀</p>
            </div>
            <button id="btn-admin-login" class="w-full py-4 bg-[#6750a4] text-white font-semibold rounded-2xl shadow-md hover:bg-[#523d8b] transition-all flex items-center justify-center gap-2 cursor-pointer">
                <span class="material-symbols-outlined">login</span> Vào Dashboard Admin
            </button>
        </div>

        <!-- Màn 3: Quiz -->
        <div id="screen-quiz" class="hidden space-y-6">
            <div class="flex justify-between items-center text-sm font-medium text-[#49454f] bg-[#f7f2fa] px-4 py-2 rounded-xl">
                <span id="question-counter">Câu 1 / 15</span>
                <span id="score-tracker">Điểm: 0</span>
            </div>
            <div class="space-y-4">
                <h2 id="question-text" class="text-xl md:text-2xl font-semibold text-[#1d1b20]"></h2>
                <div id="options-container" class="space-y-3"></div>
            </div>
            <button id="btn-next" class="ml-auto px-6 py-3 bg-[#6750a4] text-white font-semibold rounded-2xl hover:bg-[#523d8b] transition-all flex items-center gap-2 hidden cursor-pointer">
                Câu tiếp theo <span class="material-symbols-outlined">arrow_forward</span>
            </button>
        </div>

        <!-- Màn 4: Kết quả + Bảng xếp hạng (User) -->
        <div id="screen-result" class="hidden space-y-6">
            <div class="text-center bg-[#f7f2fa] p-6 rounded-3xl border border-[#e6e1e5]">
                <span class="material-symbols-outlined text-6xl text-[#6750a4] mb-2">military_tech</span>
                <h2 class="text-2xl font-bold text-[#1d1b20]">Kết Quả Của Bạn</h2>
                <p id="final-score-text" class="text-4xl font-extrabold text-[#6750a4] my-2">0 / 15</p>
                <p id="result-comment" class="text-[#49454f] font-medium"></p>
            </div>

            <div class="space-y-4">
                <h3 class="text-xl font-bold text-[#1d1b20] flex items-center gap-2">
                    <span class="material-symbols-outlined text-[#6750a4]">leaderboard</span> Bảng Xếp Hạng Đám Bạn
                </h3>
                <div id="leaderboard-list" class="bg-[#f7f2fa] rounded-2xl p-4 divide-y divide-[#e6e1e5] max-h-60 overflow-y-auto">
                    <!-- Data từ Firebase sẽ render ở đây -->
                </div>
            </div>
        </div>

        <!-- Màn 5: Admin Dashboard (PhongVN) -->
        <div id="screen-admin-dashboard" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-[#e8def8] p-4 rounded-2xl text-[#1d192b]">
                <span class="font-bold text-lg flex items-center gap-2"><span class="material-symbols-outlined">analytics</span> Admin Panel - Phong VN</span>
                <button onclick="location.reload()" class="text-sm bg-white px-3 py-1 rounded-xl font-semibold text-[#6750a4]">Thoát</button>
            </div>

            <div class="space-y-4">
                <h3 class="font-bold text-lg text-[#1d1b20]">Danh sách bài làm của đám bạn:</h3>
                <div id="admin-data-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                    <!-- Chi tiết từng đứa sẽ ở đây -->
                </div>
            </div>
        </div>

    </main>

    <!-- App Logic -->
    <script type="module">
        import { quizData } from './quiz-data.js';
        import { checkPlayerName, verifyAdminPassword, saveQuizResult, subscribeLeaderboard, subscribeAdminDashboard } from './firebase-config.js';

        let currentQuestionIndex = 0;
        let score = 0;
        let currentPlayerName = "";
        let userAnswers = []; // Lưu lại lịch sử đáp án để admin soi

        // Bắt sự kiện bấm Bắt đầu
        document.getElementById('btn-start').addEventListener('click', async () => {
            const nameInput = document.getElementById('player-name-input').value.trim();
            const errorElement = document.getElementById('name-error');
            errorElement.classList.add('hidden');

            if (!nameInput) {
                errorElement.innerText = "Nhập tên vào đã bro ơi! 🧐";
                errorElement.classList.remove('hidden');
                return;
            }

            const check = await checkPlayerName(nameInput);

            if (check.status === "ADMIN_TRIGGER") {
                // Vào màn hình Admin Password
                document.getElementById('screen-name').classList.add('hidden');
                document.getElementById('screen-admin-auth').classList.remove('hidden');
            } else if (check.status === "NAME_TAKEN") {
                errorElement.innerText = "Tên này đã có đứa dùng rồi bro! Đổi tên khác lẹ lên 😜";
                errorElement.classList.remove('hidden');
            } else {
                // Tên hợp lệ -> Vào Quiz
                currentPlayerName = check.name;
                document.getElementById('screen-name').classList.add('hidden');
                document.getElementById('screen-quiz').classList.remove('hidden');
                loadQuestion();
            }
        });

        // Bắt sự kiện Login Admin
        document.getElementById('btn-admin-login').addEventListener('click', () => {
            const pass = document.getElementById('admin-pass-input').value;
            if (verifyAdminPassword(pass)) {
                document.getElementById('screen-admin-auth').classList.add('hidden');
                document.getElementById('screen-admin-dashboard').classList.remove('hidden');
                
                // Lấy dữ liệu Realtime cho Admin
                subscribeAdminDashboard((dataList) => {
                    renderAdminDashboard(dataList);
                });
            } else {
                document.getElementById('admin-pass-error').classList.remove('hidden');
            }
        });

        // Load câu hỏi Quiz
        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            document.getElementById("question-counter").innerText = `Câu ${currentQuestionIndex + 1} / ${quizData.length}`;
            document.getElementById("score-tracker").innerText = `Điểm: ${score}`;
            document.getElementById("question-text").innerText = q.question;

            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            q.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-4 rounded-2xl border border-[#79747e]/40 bg-white hover:bg-[#f3edf7] transition-all font-medium text-[#1d1b20] cursor-pointer shadow-sm";
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById("btn-next").classList.add("hidden");
        }

        function selectAnswer(selectedIndex, selectedBtn) {
            const q = quizData[currentQuestionIndex];
            const allBtns = document.getElementById("options-container").children;

            // Lưu lịch sử câu trả lời
            userAnswers.push({
                question: q.question,
                selectedOption: q.options[selectedIndex],
                correctOption: q.options[q.correct],
                isCorrect: selectedIndex === q.correct
            });

            for (let btn of allBtns) { btn.disabled = true; }

            if (selectedIndex === q.correct) {
                selectedBtn.classList.add("bg-[#e8def8]", "border-[#6750a4]", "font-bold");
                score++;
            } else {
                selectedBtn.classList.add("bg-[#f9d8d6]", "border-[#b3261e]");
                allBtns[q.correct].classList.add("bg-[#e8def8]", "border-[#6750a4]");
            }

            document.getElementById("score-tracker").innerText = `Điểm: ${score}`;
            document.getElementById("btn-next").classList.remove("hidden");
        }

        document.getElementById('btn-next').addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        });

        async function finishQuiz() {
            document.getElementById("screen-quiz").classList.add("hidden");
            document.getElementById("screen-result").classList.remove("hidden");
            document.getElementById("final-score-text").innerText = `${score} / ${quizData.length}`;

            // Lưu lên Firebase
            await saveQuizResult(currentPlayerName, score, quizData.length, userAnswers);

            // Tải Bảng xếp hạng Realtime
            subscribeLeaderboard((list) => {
                const listContainer = document.getElementById("leaderboard-list");
                listContainer.innerHTML = "";
                list.forEach((item, idx) => {
                    const row = document.createElement("div");
                    row.className = "py-2 flex justify-between items-center text-sm";
                    row.innerHTML = `<span class="font-medium text-[#1d1b20]">${idx + 1}. ${item.playerName}</span><span class="text-[#6750a4] font-bold">${item.score}/${item.totalQuestions} điểm</span>`;
                    listContainer.appendChild(row);
                });
            });
        }

        // Render Admin Dashboard để soi đáp án đám bạn
        function renderAdminDashboard(dataList) {
            const container = document.getElementById("admin-data-list");
            container.innerHTML = "";

            if (dataList.length === 0) {
                container.innerHTML = `<p class="text-center text-[#49454f]">Chưa có đứa nào làm bài hết bro ơi!</p>`;
                return;
            }

            dataList.forEach(item => {
                const card = document.createElement("details");
                card.className = "bg-[#f7f2fa] rounded-2xl p-4 border border-[#e6e1e5] cursor-pointer";
                
                let detailsHTML = `<summary class="font-bold text-[#1d1b20] flex justify-between items-center">
                    <span>👤 ${item.playerName} (${item.score}/${item.totalQuestions} điểm)</span>
                    <span class="text-xs text-[#49454f]">${new Date(item.timestamp).toLocaleTimeString()}</span>
                </summary><div class="mt-4 space-y-2 border-t border-[#e6e1e5] pt-3 text-sm">`;

                if (item.userAnswers) {
                    item.userAnswers.forEach((ans, i) => {
                        detailsHTML += `
                            <div class="p-2 rounded-xl ${ans.isCorrect ? 'bg-[#e8def8]' : 'bg-[#f9d8d6]'}">
                                <p class="font-semibold text-[#1d1b20]">${ans.question}</p>
                                <p class="text-xs">Đã chọn: <b>${ans.selectedOption}</b> ${ans.isCorrect ? '✅' : '❌'}</p>
                                ${!ans.isCorrect ? `<p class="text-xs text-[#6750a4]">Đúng ra là: ${ans.correctOption}</p>` : ''}
                            </div>
                        `;
                    });
                }
                detailsHTML += `</div>`;
                card.innerHTML = detailsHTML;
                container.appendChild(card);
            });
        }
    </script>
</body>
  </html>
